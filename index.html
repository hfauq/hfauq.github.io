<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons: the avatar, same framing as on the page -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF9F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11141D" media="(prefers-color-scheme: dark)" />
    <!-- Theme before first paint: the visitor's saved choice, else their system setting -->
    <script>
      (() => {
        const colors = { light: '#FBF9F5', dark: '#11141D' }
        const saved = () => { try { return localStorage.getItem('theme') } catch { return null } }
        const media = matchMedia('(prefers-color-scheme: dark)')
        const apply = (theme) => {
          document.documentElement.dataset.theme = theme
          document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute('content', colors[theme]))
        }
        apply(saved() || (media.matches ? 'dark' : 'light'))
        media.addEventListener('change', (e) => { if (!saved()) apply(e.matches ? 'dark' : 'light') })
      })()
    </script>
    <title>Hugo Fauquenoi</title>
    
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="I've been building products at Todoist since 2015. We empower people with simple yet powerful productivity tools. I love surfing, photography, Kaytranada, and okonomiyaki.">
